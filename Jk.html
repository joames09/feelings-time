<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ff5722">
<title>FoodFast — Order & Sell Food Fast</title>
<style>
  /* ============ RESET & VARS ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --primary: #ff5722;
    --primary-dark: #e64a19;
    --primary-light: #fff3e0;
    --secondary: #ffc107;
    --bg: #f5f5f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --text-light: #757575;
    --border: #e8e8e8;
    --success: #22c55e;
    --danger: #ef4444;
    --warn: #f59e0b;
    --info: #3b82f6;
    --shadow: 0 2px 10px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
    --radius: 14px;
  }
  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body { padding-bottom: 0; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; }
  img { max-width: 100%; display: block; }

  /* ============ APP SHELL ============ */
  .app {
    max-width: 500px; margin: 0 auto;
    min-height: 100vh; background: var(--bg);
    position: relative; padding-bottom: 84px;
  }
  .app.no-nav { padding-bottom: 0; }

  /* ============ HEADER ============ */
  .header {
    background: var(--primary); color: white;
    padding: 14px 18px;
    position: sticky; top: 0; z-index: 40;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 2px 8px rgba(255,87,34,0.2);
  }
  .header .logo { display: flex; align-items: center; gap: 10px; }
  .header .logo-icon { font-size: 24px; }
  .header h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.4px; }
  .header .hdr-btn {
    background: rgba(255,255,255,0.18); border: none; color: white;
    padding: 7px 13px; border-radius: 9px; font-size: 12px;
    font-weight: 700; cursor: pointer;
  }
  .header .hdr-btn:active { transform: scale(0.96); }
  .header .back-btn {
    background: rgba(255,255,255,0.18); border: none; color: white;
    width: 34px; height: 34px; border-radius: 9px; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ============ BOTTOM NAV ============ */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 500px;
    background: white; display: flex;
    border-top: 1px solid var(--border);
    box-shadow: 0 -3px 14px rgba(0,0,0,0.05);
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .nav-btn {
    flex: 1; padding: 9px 2px 8px;
    background: none; border: none;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--text-light); font-size: 10px; font-weight: 600;
    transition: color 0.2s;
    position: relative;
  }
  .nav-btn .nav-icon { font-size: 21px; transition: transform 0.2s; }
  .nav-btn.active { color: var(--primary); }
  .nav-btn.active .nav-icon { transform: translateY(-1px) scale(1.08); }
  .nav-btn .dot {
    position: absolute; top: 6px; right: 50%; transform: translateX(20px);
    width: 7px; height: 7px; background: var(--danger); border-radius: 50%;
    border: 1.5px solid white;
  }

  /* ============ LANDING ============ */
  .hero {
    background: linear-gradient(135deg, #ff5722 0%, #ff9800 100%);
    color: white; padding: 34px 22px 30px;
    text-align: center;
    border-radius: 0 0 26px 26px;
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; top: -50px; right: -50px;
    width: 180px; height: 180px; background: rgba(255,255,255,0.08);
    border-radius: 50%;
  }
  .hero h2 { font-size: 26px; font-weight: 800; margin-bottom: 10px; line-height: 1.15; letter-spacing: -0.8px; }
  .hero p { font-size: 14px; opacity: 0.95; line-height: 1.5; max-width: 340px; margin: 0 auto; }
  .hero .stats { display: flex; justify-content: space-around; margin-top: 22px; gap: 8px; }
  .hero .stat { flex: 1; }
  .hero .stat .num { font-size: 20px; font-weight: 800; }
  .hero .stat .label { font-size: 11px; opacity: 0.9; margin-top: 2px; }

  .section-head { padding: 22px 18px 12px; font-size: 18px; font-weight: 800; letter-spacing: -0.4px; }
  .section-head.center { text-align: center; }

  .features-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 11px; padding: 0 16px;
  }
  .feature-card {
    background: var(--card); padding: 15px;
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .feature-card .ico { font-size: 26px; margin-bottom: 8px; }
  .feature-card h4 { font-size: 13px; font-weight: 800; margin-bottom: 3px; }
  .feature-card p { font-size: 11px; color: var(--text-light); line-height: 1.4; }

  .about-box {
    background: white; margin: 18px 16px;
    padding: 20px; border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .about-box h3 { color: var(--primary); font-size: 17px; margin-bottom: 12px; }
  .about-box p { font-size: 13px; color: var(--text-light); line-height: 1.7; margin-bottom: 10px; }
  .about-box p:last-child { margin-bottom: 0; }

  /* ============ ROLE CHOOSER ============ */
  .role-chooser { padding: 0 16px 26px; }
  .role-btn {
    width: 100%; padding: 20px 18px;
    background: white; border: 2px solid var(--border);
    border-radius: 18px; display: flex; align-items: center; gap: 16px;
    margin-bottom: 13px; cursor: pointer; text-align: left;
    transition: all 0.2s; box-shadow: var(--shadow);
  }
  .role-btn:active { transform: scale(0.98); }
  .role-btn:hover { border-color: var(--primary); }
  .role-btn .role-icon {
    font-size: 34px; width: 60px; height: 60px;
    background: var(--primary-light); border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .role-btn .role-text h4 { font-size: 16px; font-weight: 800; margin-bottom: 3px; }
  .role-btn .role-text p { font-size: 12px; color: var(--text-light); }
  .role-btn .arrow { margin-left: auto; color: var(--text-light); font-size: 20px; }

  /* ============ FORMS ============ */
  .form-page { padding: 22px 18px; }
  .form-page h2 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
  .form-page .sub { font-size: 13px; color: var(--text-light); margin-bottom: 22px; }

  .field { margin-bottom: 15px; }
  .field label {
    display: block; font-size: 12px; font-weight: 700;
    margin-bottom: 6px; color: var(--text);
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .field input, .field textarea, .field select {
    width: 100%; padding: 13px 14px;
    border: 1.5px solid var(--border); border-radius: 11px;
    font-size: 14px; background: white; color: var(--text);
    transition: border 0.15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none; border-color: var(--primary);
  }
  .field textarea { resize: vertical; min-height: 82px; }
  .field small { font-size: 11px; color: var(--text-light); display: block; margin-top: 4px; }

  .btn {
    width: 100%; padding: 14px;
    background: var(--primary); color: white; border: none;
    border-radius: 12px; font-size: 15px; font-weight: 700;
    cursor: pointer; transition: background 0.15s, transform 0.05s;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  }
  .btn:active { transform: scale(0.98); }
  .btn:hover { background: var(--primary-dark); }
  .btn.secondary { background: white; color: var(--primary); border: 2px solid var(--primary); }
  .btn.ghost { background: transparent; color: var(--text-light); border: 1.5px solid var(--border); }
  .btn.danger { background: var(--danger); }
  .btn.success { background: var(--success); }
  .btn.warn { background: var(--warn); color: #1a1a1a; }
  .btn.small { padding: 8px 14px; font-size: 13px; width: auto; }
  .btn.full { width: 100%; }

  .switch-link { text-align: center; margin-top: 18px; font-size: 14px; color: var(--text-light); }
  .switch-link a { color: var(--primary); font-weight: 700; cursor: pointer; text-decoration: none; }

  /* ============ CONTENT AREA ============ */
  .content { padding: 16px; }
  .content.flush { padding: 0; }

  /* ============ CARDS ============ */
  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); margin-bottom: 14px;
    overflow: hidden;
  }
  .card img { width: 100%; max-height: 240px; object-fit: cover; }
  .card .body { padding: 14px; }
  .card h4 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .card .price { color: var(--primary); font-weight: 800; font-size: 16px; }
  .card .desc { font-size: 13px; color: var(--text-light); margin-top: 6px; line-height: 1.45; }
  .card .meta {
    font-size: 12px; color: var(--text-light);
    margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap;
  }
  .card .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  /* ============ EMPTY STATE ============ */
  .empty { text-align: center; padding: 52px 24px; color: var(--text-light); }
  .empty .ico { font-size: 52px; opacity: 0.35; margin-bottom: 12px; }
  .empty p { font-size: 14px; line-height: 1.5; }

  /* ============ SECTION TITLES ============ */
  .section-title {
    font-size: 15px; font-weight: 800; color: var(--text);
    margin: 20px 4px 12px; display: flex;
    justify-content: space-between; align-items: center;
  }
  .section-title:first-child { margin-top: 4px; }

  /* ============ BADGES ============ */
  .badge {
    display: inline-block; padding: 3px 9px;
    border-radius: 6px; font-size: 10px;
    font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .badge.pending { background: #fef3c7; color: #92400e; }
  .badge.preparing { background: #dbeafe; color: #1e40af; }
  .badge.delivering { background: #e0e7ff; color: #3730a3; }
  .badge.delivered { background: #d1fae5; color: #065f46; }
  .badge.cancelled { background: #fee2e2; color: #991b1b; }
  .badge.live { background: #ef4444; color: white; display: inline-flex; align-items: center; gap: 5px; }
  .badge.warn { background: #fef3c7; color: #92400e; }

  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: white; animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* ============ STATS GRID (Dashboards) ============ */
  .stats-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 11px; margin-bottom: 18px;
  }
  .stat-card {
    background: white; border-radius: var(--radius);
    padding: 15px; box-shadow: var(--shadow);
    position: relative; overflow: hidden;
  }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--primary);
  }
  .stat-card.success::before { background: var(--success); }
  .stat-card.warn::before { background: var(--warn); }
  .stat-card.info::before { background: var(--info); }
  .stat-card .num { font-size: 22px; font-weight: 800; letter-spacing: -0.6px; }
  .stat-card .label { font-size: 11px; color: var(--text-light); margin-top: 3px; font-weight: 600; }

  /* ============ ACCOUNT ============ */
  .profile-head {
    text-align: center; padding: 24px 16px 18px;
    background: white; margin-bottom: 16px;
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .avatar {
    width: 88px; height: 88px; border-radius: 50%;
    background: var(--primary); color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 800;
    margin: 0 auto 12px; overflow: hidden;
    border: 4px solid white; box-shadow: var(--shadow-lg);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .profile-head h3 { font-size: 18px; margin-bottom: 4px; }
  .profile-head p { font-size: 13px; color: var(--text-light); }

  .menu-list {
    background: white; border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px;
  }
  .menu-item {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 16px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item:active { background: var(--bg); }
  .menu-item .icon { font-size: 21px; width: 26px; text-align: center; }
  .menu-item .label { flex: 1; font-size: 14px; font-weight: 600; }
  .menu-item .sub { font-size: 11px; color: var(--text-light); margin-top: 2px; font-weight: 400; }
  .menu-item .arrow { color: var(--text-light); font-size: 18px; }

  /* ============ MODAL ============ */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 500; padding: 0;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: white; width: 100%; max-width: 500px;
    border-radius: 22px 22px 0 0;
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0));
    max-height: 90vh; overflow-y: auto;
    animation: slideUp 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; position: sticky; top: -20px;
    background: white; padding: 10px 0; z-index: 2;
  }
  .modal-head h3 { font-size: 17px; font-weight: 800; }
  .modal-close {
    background: var(--bg); border: none; color: var(--text-light);
    width: 34px; height: 34px; border-radius: 50%; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }

  /* ============ TOAST ============ */
  .toast {
    position: fixed; bottom: 100px; left: 50%;
    transform: translate(-50%, 100px);
    background: #1a1a1a; color: white;
    padding: 12px 20px; border-radius: 11px;
    font-size: 14px; font-weight: 600; z-index: 9999;
    opacity: 0; transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
    pointer-events: none; max-width: 90vw; text-align: center;
    box-shadow: var(--shadow-lg);
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast.success { background: var(--success); }
  .toast.danger { background: var(--danger); }
  .toast.warn { background: var(--warn); color: #1a1a1a; }

  /* ============ LIVE STREAM BOX ============ */
  .stream-box {
    background: #111; color: white;
    border-radius: var(--radius); overflow: hidden;
    aspect-ratio: 16 / 9;
    display: flex; align-items: center; justify-content: center;
    position: relative; margin-bottom: 14px;
  }
  .stream-box .live-tag { position: absolute; top: 12px; left: 12px; }
  .stream-box .placeholder { text-align: center; padding: 20px; }
  .stream-box .placeholder .ico { font-size: 42px; margin-bottom: 8px; opacity: 0.7; }
  .stream-box .placeholder p { font-size: 14px; opacity: 0.9; }

  /* ============ VIDEO ============ */
  .video-box {
    width: 100%; max-height: 320px; background: #000;
    border-radius: 10px; display: block;
  }

  /* ============ PROGRESS BAR ============ */
  .progress-labels {
    display: flex; justify-content: space-between;
    font-size: 10px; color: var(--text-light);
    margin-bottom: 6px; font-weight: 600;
  }
  .progress-track {
    height: 8px; background: var(--border);
    border-radius: 4px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--primary);
    transition: width 0.4s; border-radius: 4px;
  }

  /* ============ TAB FILTERS ============ */
  .tabs {
    display: flex; gap: 6px; padding: 0 4px 12px;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 8px 14px; border-radius: 20px;
    background: white; border: 1.5px solid var(--border);
    font-size: 13px; font-weight: 700; white-space: nowrap;
    color: var(--text-light); cursor: pointer; flex-shrink: 0;
  }
  .tab.active { background: var(--primary); color: white; border-color: var(--primary); }

  /* ============ BANNER ============ */
  .banner {
    padding: 12px 16px; border-radius: 10px;
    font-size: 13px; margin-bottom: 14px;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .banner.warn { background: #fef3c7; color: #92400e; }
  .banner.danger { background: #fee2e2; color: #991b1b; }
  .banner.info { background: #dbeafe; color: #1e40af; }

  /* ============ SMALL HELPERS ============ */
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .muted { color: var(--text-light); }
  .text-sm { font-size: 12px; }
  .mt-1 { margin-top: 8px; }
  .mt-2 { margin-top: 16px; }
  .mb-2 { margin-bottom: 16px; }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
  .hidden { display: none !important; }

  /* ============ SELLER PENDING ============ */
  .pending-box {
    background: white; border-radius: var(--radius);
    padding: 26px 20px; text-align: center;
    box-shadow: var(--shadow);
  }
  .pending-box .big-ico { font-size: 64px; margin-bottom: 12px; }
  .pending-box h3 { font-size: 19px; margin-bottom: 10px; }
  .pending-box p { font-size: 14px; color: var(--text-light); line-height: 1.6; margin-bottom: 16px; }
  .pending-info {
    text-align: left; background: var(--bg);
    padding: 14px; border-radius: 10px;
    font-size: 13px; line-height: 1.9;
  }
  .pending-info b { color: var(--text); }

  /* ============ DISTANCE PILL ============ */
  .distance-pill {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--primary-light); color: var(--primary);
    padding: 3px 9px; border-radius: 8px;
    font-size: 11px; font-weight: 700;
  }

  /* ============ REFERRAL BOX ============ */
  .referral-code {
    font-size: 26px; font-weight: 800;
    letter-spacing: 3px; background: var(--primary-light);
    color: var(--primary); padding: 14px;
    border-radius: 12px; margin: 14px 0;
    text-align: center;
  }
  .referral-track {
    height: 8px; background: var(--border);
    border-radius: 4px; overflow: hidden; margin-top: 8px;
  }
  .referral-fill {
    height: 100%; background: var(--primary);
    transition: width 0.4s; border-radius: 4px;
  }

  /* ============ MEDIA QUERIES ============ */
  @media (max-width: 380px) {
    .features-grid { grid-template-columns: 1fr; }
    .hero h2 { font-size: 22px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   FoodFast — Customer (Buyer) & Seller App
   Shares localStorage with admin.html (foodfast_db_v1)
   ============================================================ */

const DB_KEY = 'foodfast_db_v1';
const ADMIN_KEY = 'foodfast_admin_v1';

/* ---------- Storage ---------- */
const DB = {
  data: null,
  load() {
    try { this.data = JSON.parse(localStorage.getItem(DB_KEY)) || null; } catch(e) { this.data = null; }
    if (!this.data) {
      this.data = { users: [], posts: [], reels: [], streams: [], orders: [], session: null };
    }
    ['users','posts','reels','streams','orders'].forEach(k => { if (!Array.isArray(this.data[k])) this.data[k] = []; });
    return this.data;
  },
  save() { localStorage.setItem(DB_KEY, JSON.stringify(this.data)); },
  uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
};

const AdminStore = {
  data: null,
  load() {
    try { this.data = JSON.parse(localStorage.getItem(ADMIN_KEY)) || null; } catch(e) { this.data = null; }
    if (!this.data) this.data = { messages: [], warnings: [], blockedUsers: [], moderationLog: [] };
    ['messages','warnings','blockedUsers','moderationLog'].forEach(k => { if (!Array.isArray(this.data[k])) this.data[k] = []; });
    return this.data;
  },
  save() { localStorage.setItem(ADMIN_KEY, JSON.stringify(this.data)); }
};

DB.load();
AdminStore.load();

/* ---------- Helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type='') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2400);
}

function genReferralCode(name='') {
  const base = (name || 'USER').replace(/[^a-zA-Z]/g,'').slice(0,4).toUpperCase() || 'USER';
  return base + Math.random().toString(36).slice(2,6).toUpperCase();
}

// Haversine distance (km)
function distanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI / 180;
  const dLng = (lng2-lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
            Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function getCurrentUser() {
  if (!DB.data.session) return null;
  return DB.data.users.find(u => u.id === DB.data.session.userId) || null;
}
function userById(id) { return DB.data.users.find(u => u.id === id); }
function isUserBlocked(userId) { return AdminStore.data.blockedUsers.some(b => b.userId === userId); }
function getUserWarnings(userId) { return AdminStore.data.warnings.filter(w => w.userId === userId); }
function getUserMessages(userId) {
  return AdminStore.data.messages.filter(m => m.fromUserId === userId || (m.fromUserId === 'ADMIN' && m.toUserId === userId));
}

/* ---------- App State ---------- */
const state = {
  view: 'landing',
  authRole: null,     // 'buyer' | 'seller'
  authMode: 'login',  // 'login' | 'signup'
  sellerTab: 'home',
  buyerTab: 'home',
  orderFilter: 'all',
  msgFilter: 'all',
  _locDraft: { lat: null, lng: null }
};

/* ---------- Router ---------- */
function go(view, patch = {}) {
  state.view = view;
  Object.assign(state, patch);
  window.scrollTo(0, 0);
  render();
}

/* ---------- Render ---------- */
function render() {
  const root = $('#root');
  const blocked = DB.data.session ? isUserBlocked(DB.data.session.userId) : false;

  if (blocked) { root.innerHTML = renderBlockedScreen(); return; }

  switch (state.view) {
    case 'landing':    root.innerHTML = renderLanding(); break;
    case 'auth':       root.innerHTML = renderAuth(); break;
    case 'sellerApp':  root.innerHTML = renderSellerApp(); break;
    case 'buyerApp':   root.innerHTML = renderBuyerApp(); break;
    default:           root.innerHTML = renderLanding();
  }
}

function detectLocation() {
  if (!navigator.geolocation) { toast('Geolocation not supported', 'warn'); return; }
  toast('Detecting location...');
  navigator.geolocation.getCurrentPosition(
    pos => {
      $('#latField').value = pos.coords.latitude.toFixed(6);
      $('#lngField').value = pos.coords.longitude.toFixed(6);
      $('#locStatus').textContent = `✓ Location set (${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)})`;
      toast('Location captured ✓', 'success');
    },
    err => toast('Could not get location: ' + err.message, 'danger'),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function handleAuth(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const isSeller = state.authRole === 'seller';
  const isSignup = state.authMode === 'signup';

  if (isSignup) {
    const email = (fd.get('email') || '').trim().toLowerCase();
    if (DB.data.users.some(u => u.email.toLowerCase() === email)) {
      toast('Email already registered', 'warn'); return;
    }
    const user = {
      id: DB.uid(),
      role: state.authRole,
      name: fd.get('name').trim(),
      email,
      phone: fd.get('phone').trim(),
      address: fd.get('address').trim(),
      password: fd.get('password'),
      lat: parseFloat(fd.get('lat')) || null,
      lng: parseFloat(fd.get('lng')) || null,
      avatar: null,
      referralCode: genReferralCode(fd.get('name')),
      referredBy: (fd.get('referral') || '').trim().toUpperCase() || null,
      invited: [],
      discount: 0,
      approved: isSeller ? false : true,
      businessName: isSeller ? fd.get('businessName').trim() : null,
      businessType: isSeller ? fd.get('businessType') : null,
      bio: isSeller ? (fd.get('bio') || '').trim() : null,
      createdAt: Date.now()
    };
    DB.data.users.push(user);

    // Apply referral credit to inviter
    if (user.referredBy) {
      const inviter = DB.data.users.find(u => u.referralCode === user.referredBy);
      if (inviter) {
        inviter.invited = inviter.invited || [];
        inviter.invited.push(user.id);
        if (inviter.invited.length >= 10) inviter.discount = 10;
      }
    }

    DB.data.session = { userId: user.id, role: user.role };
    DB.save();

    if (isSeller) {
      toast('Account created! Awaiting admin approval.', 'warn');
      go('sellerApp');
    } else {
      toast('Welcome to FoodFast! 🎉', 'success');
      go('buyerApp');
    }
  } else {
    const email = (fd.get('email') || '').trim().toLowerCase();
    const pwd = fd.get('password');
    const user = DB.data.users.find(u =>
      u.email.toLowerCase() === email && u.password === pwd && u.role === state.authRole
    );
    if (!user) { toast('Invalid credentials', 'danger'); return; }
    DB.data.session = { userId: user.id, role: user.role };
    DB.save();
    toast(`Welcome back, ${user.name.split(' ')[0]}!`, 'success');
    go(user.role === 'seller' ? 'sellerApp' : 'buyerApp');
  }
}

function previewVideo(e) {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  $('#vidPreview').innerHTML = `<video class="video-box" src="${url}" controls muted style="margin-bottom:12px;"></video>`;
  const reader = new FileReader();
  reader.onload = ev => { $('#vidPreview').dataset.data = ev.target.result; };
  reader.readAsDataURL(file);
}

function handleReel(e) {
  e.preventDefault();
  const me = getCurrentUser();
  const fd = new FormData(e.target);
  const videoData = $('#vidPreview')?.dataset.data || null;
  DB.data.reels.push({
    id: DB.uid(),
    sellerId: me.id,

    moderation: 'pending',

  DB.data.reels = DB.data.reels.filter(r => r.id !== id);

}

function openOrderDialog(postId) {
  const me = getCurrentUser();
  const post = DB.data.posts.find(p => p.id === postId);
  if (!post) return;
  const seller = userById(post.sellerId);
  const instructions = me.deliveryInstructions || '';
  openModal(`Order from ${esc(seller?.businessName || seller?.name || 'Seller')}`, `
    <div style="text-align:center;margin-bottom:14px;">
      ${post.image ? `<img src="${post.image}" style="width:100%;border-radius:12px;max-height:180px;object-fit:cover;">` : ''}

      <div class="field"><label>Delivery Notes (optional)</label><textarea name="notes" placeholder="e.g. Call when you arrive...">${esc(instructions)}</textarea></div>
      <button class="btn full" type="submit">Confirm Order</button>
    </form>
  `);

function placeOrder(e, postId) {
  e.preventDefault();
  const me = getCurrentUser();
  const post = DB.data.posts.find(p => p.id === postId);
  const fd = new FormData(e.target);
  const qty = parseInt(fd.get('qty')) || 1;
  const seller = userById(post.sellerId);
  let dist = null;
  if (me.lat && me.lng && seller?.lat && seller?.lng) {
    dist = distanceKm(me.lat, me.lng, seller.lat, seller.lng);
  }
  DB.data.orders.push({
    id: DB.uid(),
    buyerId: me.id,
    sellerId: post.sellerId,
    items: [{ postId: post.id, title: post.title, price: post.price, qty }],
    total: post.price * qty,
    status: 'pending',
    address: fd.get('address').trim(),
    notes: (fd.get('notes') || '').trim(),
    distance: dist,
    createdAt: Date.now(),
    updatedAt: Date.now()
  });
  DB.save();
  closeModal();
  toast('Order placed! 🎉', 'success');
  state.buyerTab = 'myorders';
  render();
}

function buyerMyOrders(me) {
  const filter = state.orderFilter || 'all';
  let orders = DB.data.orders.filter(o => o.buyerId === me.id).sort((a, b) => b.createdAt - a.createdAt);
  if (filter !== 'all') orders = orders.filter(o => o.status === filter);

  const counts = {
    all: DB.data.orders.filter(o => o.buyerId === me.id).length,
    pending: DB.data.orders.filter(o => o.buyerId === me.id && o.status === 'pending').length,
    preparing: DB.data.orders.filter(o => o.buyerId === me.id && o.status === 'preparing').length,
    delivering: DB.data.orders.filter(o => o.buyerId === me.id && o.status === 'delivering').length,
    delivered: DB.data.orders.filter(o => o.buyerId === me.id && o.status === 'delivered').length
  };

  return `
    <h2 style="font-size:20px;font-weight:800;margin-bottom:12px;">📦 My Orders</h2>

    <div class="tabs">
      ${Object.entries(counts).map(([k, v]) => `
        <button class="tab ${filter===k?'active':''}" onclick="state.orderFilter='${k}';render()">${k} (${v})</button>
      `).join('')}
    </div>

    ${orders.length ? orders.map(o => {
      const seller = userById(o.sellerId);
      const steps = ['pending', 'preparing', 'delivering', 'delivered'];
      const idx = steps.indexOf(o.status);
      const progress = o.status === 'cancelled' ? 0 : ((idx + 1) / 4) * 100;

      return `<div class="card"><div class="body">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;">
          <b style="font-size:14px;">${o.items.map(i => `${i.qty}× ${esc(i.title)}`).join(', ')}</b>
          <span class="badge ${o.status}">${o.status}</span>
        </div>
        <div class="meta" style="margin-top:8px;">
          <span>🏪 ${esc(seller?.businessName || seller?.name || 'Seller')}</span>
          ${o.distance != null ? `<span>📍 ${o.distance.toFixed(1)} km</span>` : ''}
          <span>💰 $${o.total.toFixed(2)}</span>
        </div>
        <div class="desc">📍 ${esc(o.address)}</div>
        ${o.notes ? `<div class="desc">📝 ${esc(o.notes)}</div>` : ''}

        <div style="margin-top:14px;">
          <div class="progress-labels">
            <span>Pending</span><span>Preparing</span><span>Delivering</span><span>Delivered</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width:${progress}%"></div>
          </div>
        </div>

        <div class="meta" style="margin-top:10px;">
          <span>Ordered ${new Date(o.createdAt).toLocaleString()}</span>
        </div>

        ${o.status === 'delivered' ? `
          <div class="actions">
            <button class="btn small success" onclick="reorder('${o.id}')">🔁 Reorder</button>
          </div>
        ` : ''}
      </div></div>`;
    }).join('') : `<div class="empty"><div class="ico">📦</div><p>No orders yet. Order something delicious!</p></div>`}
  `;
}

    status: 'pending',
    createdAt: Date.now(),
    updatedAt: Date.now()

  return `
    <div class="profile-head">
      <div class="avatar">${me.avatar ? `<img src="${me.avatar}">` : esc(me.name.charAt(0).toUpperCase())}</div>
      <h3>${esc(me.name)}</h3>
      <p>${esc(me.email)}</p>
      <label class="btn small secondary mt-2" style="display:inline-flex;cursor:pointer;">
        Change Photo
        <input type="file" accept="image/*" style="display:none;" onchange="changeAvatar(event)">
      </label>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="num">${orders.length}</div><div class="label">Orders Placed</div></div>
      <div class="stat-card info"><div class="num">${favSellers.size}</div><div class="label">Restaurants Tried</div></div>
    </div>

    <div class="menu-list">
      <div class="menu-item" onclick="openOrderHistory()">
        <span class="icon">📜</span>
        <div class="label">Order History<div class="sub">${orders.length} total orders</div></div>
        <span class="arrow">›</span>
      </div>
      <div class="menu-item" onclick="openFavorites()">
        <span class="icon">❤️</span>
        <div class="label">Favorite Restaurants<div class="sub">${favSellers.size} tried</div></div>
        <span class="arrow">›</span>
      </div>
      <div class="menu-item" onclick="openDeliveryInstructions()">
        <span class="icon">🚚</span>
        <div class="label">Delivery Instructions<div class="sub">${me.deliveryInstructions ? 'Saved' : 'Not set'}</div></div>
        <span class="arrow">›</span>
      </div>
      <div class="menu-item" onclick="openReferral()">
        <span class="icon">🎁</span>
        <div class="label">Referral Code<div class="sub">${esc(me.referralCode)} ${discountActive ? '🏆 10% active' : `(${invited}/10)`}</div></div>
        <span class="arrow">›</span>
      </div>
      <div class="menu-item" onclick="setMyLocation()">
        <span class="icon">📍</span>
        <div class="label">Set My Location<div class="sub">${me.lat ? 'Set ✓' : 'Not set'}</div></div>
        <span class="arrow">›</span>
      </div>
      <div class="menu-item" onclick="openContactAdmin()">
        <span class="icon">💬</span>
        <div class="label">Contact Admin<div class="sub">Send a message</div></div>
        <span class="arrow">›</span>
      </div>
    </div>

    <button class="btn ghost full" onclick="logout()">Log Out</button>
  `;
}

function openOrderHistory() {
  const me = getCurrentUser();
  const orders = DB.data.orders.filter(o => o.buyerId === me.id).sort((a, b) => b.createdAt - a.createdAt);
  const html = orders.length ? orders.map(o => `
    <div class="card" style="margin-bottom:10px;"><div class="body">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b>$${o.total.toFixed(2)}</b>
        <span class="badge ${o.status}">${o.status}</span>
      </div>
      <div class="desc">${o.items.map(i => `${i.qty}× ${esc(i.title)}`).join('<br>')}</div>
      <div class="meta"><span>📅 ${new Date(o.createdAt).toLocaleDateString()}</span></div>
    </div></div>
  `).join('') : '<p class="muted">No order history yet.</p>';
  openModal('📜 Order History', html);
}

function openFavorites() {
  const me = getCurrentUser();
  const orders = DB.data.orders.filter(o => o.buyerId === me.id);
  const counts = {};
  orders.forEach(o => { counts[o.sellerId] = (counts[o.sellerId] || 0) + 1; });
  const fav = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const html = fav.length ? `
    <p class="muted text-sm mb-2">Based on how often you order from them.</p>
    ${fav.map(([sid, c]) => {
      const s = userById(sid);
      return `<div class="card" style="margin-bottom:10px;"><div class="body">
        <h4>🏪 ${esc(s?.businessName || s?.name || 'Seller')}</h4>
        <div class="meta">${c} order${c > 1 ? 's' : ''}</div>
        <button class="btn small secondary mt-2" onclick="viewSeller('${sid}')">View Menu</button>
      </div></div>`;
    }).join('')}
  ` : '<p class="muted">Order from a few sellers to see favorites here.</p>';
  openModal('❤️ Favorite Restaurants', html);
}

function openDeliveryInstructions() {
  const me = getCurrentUser();
  openModal('🚚 Delivery Instructions', `
    <div class="field">
      <label>Default delivery instructions</label>
      <textarea id="diField" placeholder="e.g. Gate code 1234, call on arrival...">${esc(me.deliveryInstructions || '')}</textarea>
    </div>
    <button class="btn full" onclick="saveDeliveryInstructions()">Save Instructions</button>
  `);
}

function saveDeliveryInstructions() {
  const me = getCurrentUser();
  me.deliveryInstructions = $('#diField').value.trim();
  DB.save();
  toast('Instructions saved ✓', 'success');
  closeModal();
}

function setMyLocation() {
  if (!navigator.geolocation) { toast('Geolocation not supported', 'warn'); return; }
  toast('Getting your location...');
  navigator.geolocation.getCurrentPosition(
    pos => {
      const me = getCurrentUser();
      me.lat = pos.coords.latitude;
      me.lng = pos.coords.longitude;
      DB.save();
      toast('Location set ✓', 'success');
      render();
    },
    err => toast('Could not get location: ' + err.message, 'danger'),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

/* ============================================================
   MODAL & HELPERS
   ============================================================ */
function openModal(title, html) {
  let bg = document.getElementById('appModal');
  if (!bg) {
    bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.id = 'appModal';
    bg.onclick = (e) => { if (e.target === bg) closeModal(); };
    bg.innerHTML = `
      <div class="modal">
        <div class="modal-head">
          <h3 id="appModalTitle"></h3>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div id="appModalBody"></div>
      </div>`;
    document.body.appendChild(bg);
  }
  $('#appModalTitle').textContent = title;
  $('#appModalBody').innerHTML = html;
  bg.classList.add('open');
}

function closeModal() {
  const bg = document.getElementById('appModal');
  if (bg) bg.classList.remove('open');
}

function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(
      () => toast('Copied!', 'success'),
      () => toast('Copy failed', 'danger')
    );
  } else {
    toast('Copy not supported', 'warn');
  }
}

/* ============================================================
   BOOT
   ============================================================ */
(function boot() {
  // If session exists, resume the correct app
  if (DB.data.session) {
    const me = getCurrentUser();
    if (me) {
      if (isUserBlocked(me.id)) { state.view = 'landing'; render(); return; }
      state.view = me.role === 'seller' ? 'sellerApp' : 'buyerApp';
    }
  }
  render();

  // Auto-refresh pending-seller approval every 15s while on pending screen
  setInterval(() => {
    if (state.view === 'sellerApp') {
      const me = getCurrentUser();
      if (me && me.role === 'seller' && !me.approved) {
        DB.load();
        const updated = DB.data.users.find(u => u.id === me.id);
        if (updated && updated.approved) { toast('Approved! 🎉', 'success'); render(); }
      }
    }
  }, 15000);
})();
</script>
</body>
</html>
