<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodFast Admin — Control Center</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --primary:#ff5722; --primary-dark:#e64a19;
    --bg:#0f1115; --bg2:#171a21; --card:#1c2028; --card2:#232833;
    --text:#e8eaed; --text-dim:#9aa3b2; --border:#2b303b;
    --success:#22c55e; --danger:#ef4444; --warn:#f59e0b; --info:#3b82f6;
    --accent:#8b5cf6;
    --shadow:0 4px 20px rgba(0,0,0,0.35);
  }
  body { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; }
  a { color:var(--primary); }

  .sidebar { width:250px; background:var(--bg2); border-right:1px solid var(--border); padding:22px 0; position:fixed; top:0; bottom:0; left:0; display:flex; flex-direction:column; z-index:100; transition:transform 0.25s; }
  .sidebar .brand { padding:0 22px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  .sidebar .brand .logo { width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg, var(--primary), #ff9800); display:flex; align-items:center; justify-content:center; font-size:20px; }
  .sidebar .brand h1 { font-size:17px; font-weight:800; letter-spacing:-0.3px; }
  .sidebar .brand small { display:block; font-size:10px; color:var(--text-dim); font-weight:500; letter-spacing:0.5px; }
  .sidebar nav { flex:1; padding:14px 0; overflow-y:auto; }
  .nav-item { display:flex; align-items:center; gap:12px; padding:11px 22px; cursor:pointer; color:var(--text-dim); font-size:14px; font-weight:500; border-left:3px solid transparent; transition:all 0.15s; }
  .nav-item:hover { background:var(--card); color:var(--text); }
  .nav-item.active { background:var(--card); color:var(--text); border-left-color:var(--primary); }
  .nav-item .ico { font-size:17px; width:20px; text-align:center; }
  .nav-item .count { margin-left:auto; background:var(--primary); color:white; font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; min-width:20px; text-align:center; }
  .nav-item .count.danger { background:var(--danger); }
  .nav-item .count.warn { background:var(--warn); color:#1a1a1a; }
  .sidebar .footer { padding:14px 22px; border-top:1px solid var(--border); font-size:12px; color:var(--text-dim); }
  .sidebar .footer .admin-name { color:var(--text); font-weight:700; margin-bottom:6px; }

  .main { flex:1; margin-left:250px; min-height:100vh; padding:0 0 40px; }
  .topbar { background:var(--bg2); border-bottom:1px solid var(--border); padding:16px 28px; position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .topbar h2 { font-size:20px; font-weight:700; }
  .topbar .sub { font-size:12px; color:var(--text-dim); margin-top:2px; }
  .topbar .actions { display:flex; gap:10px; align-items:center; }
  .search { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:9px 14px; color:var(--text); font-size:13px; width:260px; }
  .search:focus { outline:none; border-color:var(--primary); }
  .page { padding:24px 28px; }

  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:16px; margin-bottom:24px; }
  .stat-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; position:relative; overflow:hidden; }
  .stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--primary); }
  .stat-card.success::before { background:var(--success); }
  .stat-card.warn::before { background:var(--warn); }
  .stat-card.info::before { background:var(--info); }
  .stat-card.accent::before { background:var(--accent); }
  .stat-card .label { font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; font-weight:600; }
  .stat-card .num { font-size:28px; font-weight:800; margin:8px 0 4px; letter-spacing:-1px; }
  .stat-card .trend { font-size:12px; color:var(--text-dim); }

  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:16px; }
  .card-pad { padding:18px; }
  .card-head { padding:16px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .card-head h4 { font-size:15px; }
  .card-head .sub { font-size:12px; color:var(--text-dim); margin-top:2px; }

  .btn { padding:9px 16px; border-radius:9px; border:none; background:var(--primary); color:white; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; transition:all 0.15s; }
  .btn:hover { background:var(--primary-dark); }
  .btn.small { padding:6px 11px; font-size:12px; }
  .btn.ghost { background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn.ghost:hover { background:var(--card2); }
  .btn.success { background:var(--success); }
  .btn.danger { background:var(--danger); }
  .btn.warn { background:var(--warn); color:#1a1a1a; }
  .btn.info { background:var(--info); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }

  .tbl-wrap { overflow-x:auto; }
  table.tbl { width:100%; border-collapse:collapse; font-size:13px; }
  table.tbl th, table.tbl td { padding:11px 14px; text-align:left; border-bottom:1px solid var(--border); }
  table.tbl th { background:var(--bg2); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-dim); }
  table.tbl tr:hover td { background:var(--card2); }
  table.tbl td.actions { white-space:nowrap; }

  .badge { display:inline-block; padding:3px 9px; border-radius:6px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; }
  .badge.pending { background:rgba(245,158,11,0.15); color:var(--warn); }
  .badge.approved, .badge.delivered, .badge.active { background:rgba(34,197,94,0.15); color:var(--success); }
  .badge.rejected, .badge.cancelled, .badge.banned, .badge.blocked { background:rgba(239,68,68,0.15); color:var(--danger); }
  .badge.preparing { background:rgba(59,130,246,0.15); color:var(--info); }
  .badge.delivering { background:rgba(139,92,246,0.15); color:var(--accent); }
  .badge.warned { background:rgba(245,158,11,0.15); color:var(--warn); }
  .badge.live { background:var(--danger); color:white; display:inline-flex; align-items:center; gap:5px; }
  .live-dot { width:6px; height:6px; border-radius:50%; background:white; animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:500; padding:20px; backdrop-filter:blur(4px); }
  .modal-bg.open { display:flex; }
  .modal { background:var(--card); border-radius:16px; width:100%; max-width:560px; max-height:90vh; overflow-y:auto; border:1px solid var(--border); animation:modalIn 0.2s ease; }
  @keyframes modalIn { from{transform:scale(0.95); opacity:0} to{transform:scale(1); opacity:1} }
  .modal-head { padding:18px 20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
  .modal-head h3 { font-size:17px; }
  .modal-close { background:none; border:none; color:var(--text-dim); font-size:24px; cursor:pointer; line-height:1; }
  .modal-body { padding:20px; }
  .modal-foot { padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; }

  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-size:12px; font-weight:700; margin-bottom:6px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.4px; }
  .form-group input, .form-group textarea, .form-group select { width:100%; padding:10px 12px; background:var(--bg2); border:1px solid var(--border); border-radius:9px; color:var(--text); font-size:13px; }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline:none; border-color:var(--primary); }
  .form-group textarea { resize:vertical; min-height:80px; }

  .login-screen { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; }
  .login-card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:34px; width:100%; max-width:400px; box-shadow:var(--shadow); }
  .login-card .brand-big { display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .login-card .brand-big .logo { width:48px; height:48px; border-radius:12px; background:linear-gradient(135deg, var(--primary), #ff9800); display:flex; align-items:center; justify-content:center; font-size:24px; }
  .login-card .brand-big h2 { font-size:19px; }
  .login-card .brand-big small { font-size:11px; color:var(--text-dim); }
  .login-card h3 { margin-bottom:6px; }
  .login-card p.hint { color:var(--text-dim); font-size:13px; margin-bottom:22px; }

  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:140px; }
  .divider { height:1px; background:var(--border); margin:16px 0; }
  .empty { text-align:center; padding:48px 20px; color:var(--text-dim); }
  .empty .ico { font-size:42px; opacity:0.35; margin-bottom:10px; }
  .muted { color:var(--text-dim); }
  .text-sm { font-size:12px; }
  .text-danger { color:var(--danger); }
  .text-success { color:var(--success); }
  .text-warn { color:var(--warn); }
  .mt-1 { margin-top:8px; } .mt-2 { margin-top:16px; } .mb-2 { margin-bottom:16px; }

  .bar-chart { display:flex; align-items:flex-end; gap:8px; height:180px; padding:10px 0; }
  .bar-chart .bar-wrap { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .bar-chart .bar { width:100%; background:linear-gradient(180deg, var(--primary), var(--primary-dark)); border-radius:6px 6px 0 0; min-height:3px; transition:height 0.4s; }
  .bar-chart .bar-lbl { font-size:10px; color:var(--text-dim); }
  .bar-chart .bar-val { font-size:11px; font-weight:700; }

  .toast { position:fixed; bottom:24px; right:24px; background:var(--card2); border:1px solid var(--border); color:var(--text); padding:13px 20px; border-radius:11px; z-index:9999; font-size:14px; box-shadow:var(--shadow); transform:translateY(100px); opacity:0; transition:all 0.3s; max-width:90vw; }
  .toast.show { transform:translateY(0); opacity:1; }
  .toast.success { border-left:3px solid var(--success); }
  .toast.danger { border-left:3px solid var(--danger); }
  .toast.warn { border-left:3px solid var(--warn); }

  .mobile-toggle { display:none; background:none; border:none; color:var(--text); font-size:22px; cursor:pointer; }

  .msg { padding:14px 18px; border-bottom:1px solid var(--border); cursor:pointer; transition:background 0.15s; }
  .msg:hover { background:var(--card2); }
  .msg.unread { background:rgba(59,130,246,0.06); border-left:3px solid var(--info); }
  .msg.abusive { background:rgba(239,68,68,0.06); border-left:3px solid var(--danger); }
  .msg .head { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; gap:10px; }
  .msg .from { font-weight:700; font-size:13px; }
  .msg .time { font-size:11px; color:var(--text-dim); }
  .msg .body { font-size:13px; color:var(--text-dim); line-height:1.5; }

  .reel-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:16px; }
  .reel-card { background:var(--card); border-radius:12px; overflow:hidden; border:1px solid var(--border); }
  .reel-card video, .reel-card img { width:100%; height:160px; object-fit:cover; background:#000; display:block; }
  .reel-card .body { padding:12px; }
  .reel-card h5 { font-size:13px; margin-bottom:6px; }
  .reel-card .meta { font-size:11px; color:var(--text-dim); margin-bottom:10px; }
  .reel-card .acts { display:flex; gap:6px; flex-wrap:wrap; }

  @media (max-width:900px) {
    .sidebar { transform:translateX(-100%); }
    .sidebar.open { transform:translateX(0); }
    .main { margin-left:0; }
    .mobile-toggle { display:block; }
    .search { width:100%; max-width:200px; }
    .page { padding:16px; }
    .topbar { padding:12px 16px; }
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="brand-big">
      <div class="logo">👑</div>
      <div><h2>FoodFast Admin</h2><small>Control Center</small></div>
    </div>
    <h3>Sign In</h3>
    <p class="hint">Restricted area — company administrators only.</p>
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group"><label>Username</label><input required name="u" placeholder="Enter username"></div>
      <div class="form-group"><label>Password</label><input required type="password" name="p" placeholder="Enter password"></div>
      <button class="btn" type="submit" style="width:100%;padding:12px;">Sign In →</button>
    </form>
  </div>
</div>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo">👑</div>
    <div><h1>FoodFast</h1><small>ADMIN CONTROL</small></div>
  </div>
  <nav id="nav"></nav>
  <div class="footer">
    <div class="admin-name">👤 joames</div>
    <div>Super Admin</div>
    <button class="btn ghost small mt-1" style="width:100%;" onclick="logout()">Sign Out</button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:14px;">
      <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="sub" id="pageSub">Overview of your platform</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost small" onclick="loadAndRender()">🔄 Refresh</button>
    </div>
  </div>
  <div class="page" id="pageContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   FoodFast Admin — Backend Connected
   ============================================================ */

const API_BASE = '/api';

const API = {
  token: localStorage.getItem('ff_admin_token') || null,
  setToken(t) {
    this.token = t;
    if (t) localStorage.setItem('ff_admin_token', t);
    else localStorage.removeItem('ff_admin_token');
  },
  async req(path, options = {}) {
    const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
    if (this.token) headers.Authorization = `Bearer ${this.token}`;
    const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error || 'Request failed');
    }
    return res.json();
  },
  get:  (p)    => API.req(p),
  post: (p, b) => API.req(p, { method:'POST', body: JSON.stringify(b || {}) }),
  patch:(p, b) => API.req(p, { method:'PATCH', body: JSON.stringify(b || {}) }),
  del:  (p)    => API.req(p, { method:'DELETE' })
};

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmtDate = (ts) => new Date(ts).toLocaleString();
const fmtTime = (ts) => {
  const s = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
};

function toast(msg, type='') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- Data Store ---------- */
const D = {
  stats: null,
  sellers: [],      // all sellers
  pending: [],      // pending seller signups
  users: [],
  posts: [],
  reels: [],
  streams: [],
  orders: [],
  messages: [],
  warnings: [],
  blocked: [],
  socket: null
};

/* ---------- Login ---------- */
async function handleLogin(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  try {
    const { token } = await API.post('/auth/admin-login', {
      username: fd.get('u'),
      password: fd.get('p')
    });
    API.setToken(token);
    $('#loginScreen').style.display = 'none';
    bootAdmin();
    toast('Welcome back, Admin 👑', 'success');
  } catch (err) {
    toast('Invalid credentials', 'danger');
  }
}

function logout() {
  API.setToken(null);
  location.reload();
}

/* ---------- Router ---------- */
const routes = {
  dashboard: { title:'Dashboard', sub:'Platform overview & analytics', icon:'📊', render: renderDashboard },
  sellers:   { title:'Seller Requests', sub:'Approve or decline sellers', icon:'👨‍🍳', render: renderSellers, badge: () => D.pending.length },
  users:     { title:'All Users', sub:'Manage buyers and sellers', icon:'👥', render: renderUsers },
  posts:     { title:'Food Posts', sub:'Moderate dishes posted by sellers', icon:'🍽️', render: renderPosts },
  reels:     { title:'Reels Moderation', sub:'Review & remove non-food content', icon:'🎬', render: renderReels, badge: () => D.reels.filter(r=>r.moderation==='pending').length, badgeType:'warn' },
  streams:   { title:'Live Streams', sub:'Monitor active cooking streams', icon:'📺', render: renderStreams, badge: () => D.streams.filter(s=>s.active).length, badgeType:'danger' },
  orders:    { title:'Orders', sub:'Track all orders & delivery status', icon:'📦', render: renderOrders, badge: () => D.orders.filter(o=>['pending','preparing','delivering'].includes(o.status)).length, badgeType:'warn' },
  messages:  { title:'User Messages', sub:'Comments & reports from users', icon:'💬', render: renderMessages, badge: () => D.messages.filter(m=>!m.read).length, badgeType:'danger' },
  warnings:  { title:'Warnings & Blocks', sub:'Moderation actions history', icon:'⚠️', render: renderWarnings },
  blocked:   { title:'Blocked Users', sub:'Users banned from the platform', icon:'🚫', render: renderBlocked, badge: () => D.blocked.length, badgeType:'danger' }
};

let currentRoute = 'dashboard';

function navigate(route) {
  currentRoute = route;
  const r = routes[route];
  $('#pageTitle').textContent = r.title;
  $('#pageSub').textContent = r.sub;
  renderNav();
  $('#pageContent').innerHTML = r.render();
  if (window.innerWidth <= 900) $('#sidebar').classList.remove('open');
}

function toggleSidebar() { $('#sidebar').classList.toggle('open'); }

function renderNav() {
  $('#nav').innerHTML = Object.entries(routes).map(([key, r]) => {
    const badgeCount = r.badge ? r.badge() : 0;
    const show = badgeCount > 0;
    const badgeClass = r.badgeType || '';
    return `<div class="nav-item ${key===currentRoute?'active':''}" onclick="navigate('${key}')">
      <span class="ico">${r.icon}</span>
      <span>${r.title}</span>
      ${show ? `<span class="count ${badgeClass}">${badgeCount}</span>` : ''}
    </div>`;
  }).join('');
}

/* ---------- Data Loading ---------- */
async function loadAll() {
  const results = await Promise.allSettled([
    API.get('/admin/stats'),
    API.get('/admin/sellers/pending'),
    API.get('/admin/sellers/all'),
    API.get('/admin/users'),
    API.get('/admin/posts'),
    API.get('/admin/reels'),
    API.get('/admin/streams'),
    API.get('/admin/orders'),
    API.get('/admin/messages'),
    API.get('/admin/warnings'),
    API.get('/admin/blocked')
  ]);
  D.stats     = results[0].value || {};
  D.pending   = results[1].value || [];
  D.sellers   = results[2].value || [];
  D.users     = results[3].value || [];
  D.posts     = results[4].value || [];
  D.reels     = results[5].value || [];
  D.streams   = results[6].value || [];
  D.orders    = results[7].value || [];
  D.messages  = results[8].value || [];
  D.warnings  = results[9].value || [];
  D.blocked   = results[10].value || [];
}

async function loadAndRender() {
  try {
    await loadAll();
    renderNav();
    navigate(currentRoute);
    toast('Data refreshed', 'success');
  } catch (err) {
    toast('Failed to load: ' + err.message, 'danger');
  }
}

function connectSocket() {
  if (D.socket) return;
  D.socket = io(window.location.origin);
  D.socket.emit('join', { role: 'admin' });
  D.socket.on('order:new', () => { toast('📦 New order placed!', 'success'); loadAndRender(); });
  D.socket.on('order:updated', () => loadAndRender());
  D.socket.on('message:new', () => { toast('💬 New message', 'success'); loadAndRender(); });
  D.socket.on('reel:new', () => { toast('🎬 New reel pending', 'warn'); loadAndRender(); });
  D.socket.on('stream:started', () => loadAndRender());
}

/* ---------- Dashboard ---------- */
function renderDashboard() {
  const s = D.stats || {};
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i);
    const next = d.getTime() + 86400000;
    const dayOrders = D.orders.filter(o => new Date(o.createdAt).getTime() >= d.getTime() && new Date(o.createdAt).getTime() < next);
    days.push({
      label: d.toLocaleDateString('en', { weekday: 'short' }),
      total: dayOrders.reduce((a,o) => a + o.total, 0)
    });
  }
  const maxDay = Math.max(...days.map(d => d.total), 1);

  return `
    <div class="stats-grid">

          approved: '<span class="badge approved">✅ Approved</span>',
          removed: '<span class="badge" style="background:rgba(120,120,120,0.2);color:var(--text-dim);">🗑 Removed</span>'
        }[status];
        return `<div class="reel-card">
          ${r.video ? `<video src="${r.video}" controls muted></video>` : '<div style="height:160px;background:#000;"></div>'}

function renderMessages() {
  return `

      ${D.messages.length ? D.messages.map(m => {

        const initials = (sender?.name || 'U').charAt(0).toUpperCase();

          <div class="head">
            <div class="from">${initials} — ${esc(sender?.name || 'Unknown')} <span class="muted text-sm">(${sender?.role || ''})</span></div>

        </div>`;
      }).join('') : '<div class="empty"><div class="ico">💬</div><p>No messages</p></div>'}
    </div>

function openMessage(id) {
  const m = D.messages.find(x => x._id === id);
  if (!m) return;
  m.read = true; // local only
  const sender = m.fromUserId;
  showModal(`💬 From ${esc(sender?.name || 'Unknown')}`, `
    <div class="muted text-sm mb-2">
      <div>Email: <b>${esc(sender?.email || '—')}</b></div>
      <div>Phone: <b>${esc(sender?.phone || '—')}</b></div>
      <div>Sent: ${fmtDate(m.createdAt)}</div>
    </div>
    <div class="divider"></div>
    <div style="background:var(--bg2);padding:14px;border-radius:10px;line-height:1.6;">${esc(m.text)}</div>
    <div class="divider"></div>
    <div class="form-group">
      <label>Your reply</label>
      <textarea id="replyText" placeholder="Type a reply..."></textarea>
    </div>
  `, [
    { label:'🚩 Flag', class:'warn', action: async () => { try { await API.patch('/admin/messages/' + id + '/flag', {}); toast('Flagged', 'warn'); closeModal(); await loadAndRender(); } catch(e){ toast(e.message,'danger'); } } },
    { label:'⚠️ Warn User', class:'warn', action: () => { closeModal(); openWarnUser(sender?._id); } },
    { label:'🚫 Block', class:'danger', action: () => { closeModal(); openBlockUser(sender?._id); } },
    { label:'📤 Send Reply', class:'success', action: async () => {
      const txt = $('#replyText').value.trim();
      if (!txt) { toast('Write a reply', 'warn'); return; }
      try {
        await API.post('/messages/to-user', { userId: sender?._id, text: txt });
        toast('Reply sent ✓', 'success');
        closeModal();
      } catch (err) { toast(err.message, 'danger'); }
    }}
  ]);
}

      <div class="tbl-wrap">
        <table class="tbl">
          <tr><th>Date</th><th>User</th><th>Role</th><th>Reason</th><th>Message</th></tr>
          ${D.warnings.length ? D.warnings.map(w => `
            <tr>
              <td>${fmtDate(w.createdAt)}</td>
              <td>${esc(w.userId?.name || '(deleted)')}</td>
              <td>${esc(w.userId?.role || '-')}</td>
              <td><b>${esc(w.reason)}</b></td>
              <td class="muted text-sm">${esc(w.message)}</td>
            </tr>
          `).join('') : '<tr><td colspan="5" class="muted" style="text-align:center;padding:24px;">No warnings</td></tr>'}
        </table>
      </div>
    </div>
  `;
}

/* ---------- Blocked ---------- */
function renderBlocked() {
  return `
    <div class="card">
      <div class="card-head"><h4>🚫 Blocked Users (${D.blocked.length})</h4></div>
      <div class="tbl-wrap">
        <table class="tbl">
          <tr><th>Date</th><th>User</th><th>Email</th><th>Role</th><th>Reason</th><th>Actions</th></tr>
          ${D.blocked.length ? D.blocked.map(b => `
            <tr>
              <td>${fmtDate(b.createdAt)}</td>
              <td>${esc(b.userId?.name || '(removed)')}</td>
              <td>${esc(b.userId?.email || '-')}</td>
              <td>${esc(b.userId?.role || '-')}</td>
              <td class="muted text-sm">${esc(b.reason)}</td>
              <td><button class="btn small success" onclick="unblockUser('${b.userId?._id}')">✅ Unblock</button></td>
            </tr>
          `).join('') : '<tr><td colspan="6" class="muted" style="text-align:center;padding:24px;">No blocked users</td></tr>'}
        </table>
      </div>
    </div>
  `;
}

/* ---------- User Actions ---------- */
function openWarnUser(userId) {
  const u = D.users.find(x => x._id === userId);
  if (!u) return;
  showModal(`⚠️ Warn ${esc(u.name)}`, `
    <div class="form-group">
      <label>Reason</label>
      <select id="warnReason">
        <option>Inappropriate content</option>
        <option>Non-food reel content</option>
        <option>Abusive language</option>
        <option>Spam or misleading</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Message</label>
      <textarea id="warnMsg" placeholder="Explain what needs to change..."></textarea>
    </div>
  `, [
    { label:'Cancel', class:'ghost', action: closeModal },
    { label:'⚠️ Warn', class:'warn', action: async () => {
      try {
        await API.post('/admin/warn/' + userId, {
          reason: $('#warnReason').value,
          message: $('#warnMsg').value.trim() || 'Please review our community guidelines.'
        });
        toast('Warning sent', 'warn');
        closeModal();
        await loadAndRender();
      } catch (err) { toast(err.message, 'danger'); }
    }}
  ]);
}

function openBlockUser(userId) {
  const u = D.users.find(x => x._id === userId);
  if (!u) return;
  showModal(`🚫 Block ${esc(u.name)}`, `
    <div class="text-danger mb-2">⚠️ This will prevent the user from using the app.</div>
    <div class="form-group">
      <label>Reason</label>
      <select id="blockReason">
        <option>Repeated policy violations</option>
        <option>Abusive messages</option>
        <option>Posting non-food content</option>
        <option>Fraud / scam</option>
        <option>Other</option>
      </select>
    </div>
  `, [
    { label:'Cancel', class:'ghost', action: closeModal },
    { label:'🚫 Block', class:'danger', action: async () => {
      try {
        await API.post('/admin/block/' + userId, { reason: $('#blockReason').value });
        toast('User blocked', 'danger');
        closeModal();
        await loadAndRender();
      } catch (err) { toast(err.message, 'danger'); }
    }}
  ]);
}

async function unblockUser(userId) {
  if (!confirm('Unblock this user?')) return;
  try {
    await API.post('/admin/unblock/' + userId, {});
    toast('User unblocked', 'success');
    await loadAndRender();
  } catch (err) { toast(err.message, 'danger'); }
}

function openContactUser(userId) {
  const u = D.users.find(x => x._id === userId);
  if (!u) return;
  showModal(`✉️ Contact ${esc(u.name)}`, `
    <div class="form-group">
      <label>Subject</label>
      <input id="ctSubject" placeholder="e.g. Account update">
    </div>
    <div class="form-group">
      <label>Message</label>
      <textarea id="ctBody" placeholder="Type your message..."></textarea>
    </div>
  `, [
    { label:'Cancel', class:'ghost', action: closeModal },
    { label:'📤 Send', class:'success', action: async () => {
      const subj = $('#ctSubject').value.trim() || 'Message from FoodFast Admin';
      const body = $('#ctBody').value.trim();
      if (!body) { toast('Write a message', 'warn'); return; }
      try {
        await API.post('/messages/to-user', { userId: u._id, text: `[${subj}] ${body}` });
        toast('Message sent', 'success');
        closeModal();
      } catch (err) { toast(err.message, 'danger'); }
    }}
  ]);
}

/* ---------- Modal ---------- */
function showModal(title, bodyHTML, buttons = []) {
  let bg = document.getElementById('adminModal');
  if (!bg) {
    bg = document.createElement('div');
    bg.className = 'modal-bg'; bg.id = 'adminModal';
    bg.onclick = e => { if (e.target === bg) closeModal(); };
    bg.innerHTML = `<div class="modal"><div class="modal-head"><h3 id="mTitle"></h3><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body" id="mBody"></div><div class="modal-foot" id="mFoot"></div></div>`;
    document.body.appendChild(bg);
  }
  document.getElementById('mTitle').innerHTML = title;
  document.getElementById('mBody').innerHTML = bodyHTML;
  document.getElementById('mFoot').innerHTML = buttons.map((b,i) => `<button class="btn ${b.class||''}" data-idx="${i}">${b.label}</button>`).join('');
  buttons.forEach((b,i) => {
    const el = document.querySelector(`#mFoot [data-idx="${i}"]`);
    if (el) el.onclick = b.action;
  });
  bg.classList.add('open');
}

function closeModal() {
  const bg = document.getElementById('adminModal');
  if (bg) bg.classList.remove('open');
}

/* ---------- Boot ---------- */
async function bootAdmin() {
  renderNav();
  await loadAndRender();
  connectSocket();
}

(function init() {
  if (API.token) {
    document.getElementById('loginScreen').style.display = 'none';
    bootAdmin();
  }
})();
</script>
