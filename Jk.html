<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ff5722">
<title>FoodFast — Order & Sell Food Fast</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.0.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --primary:#ff5722; --primary-dark:#e64a19; --primary-light:#fff3e0;
    --bg:#f5f5f5; --card:#ffffff; --text:#1a1a1a; --text-light:#757575;
    --border:#e8e8e8; --success:#22c55e; --danger:#ef4444; --warn:#f59e0b; --info:#3b82f6;
    --shadow:0 2px 10px rgba(0,0,0,0.06); --shadow-lg:0 10px 30px rgba(0,0,0,0.12);
    --radius:14px;
  }
  html, body {
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  button { font-family:inherit; cursor:pointer; }
  input, textarea, select { font-family:inherit; }
  img { max-width:100%; display:block; }

  .app { max-width:500px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:84px; }
  .app.no-nav { padding-bottom:0; }

  .header {
    background:var(--primary); color:white; padding:14px 18px;
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 2px 8px rgba(255,87,34,0.2);
  }
  .header .logo { display:flex; align-items:center; gap:10px; }
  .header .logo-icon { font-size:24px; }
  .header h1 { font-size:18px; font-weight:800; letter-spacing:-0.4px; }
  .header .hdr-btn { background:rgba(255,255,255,0.18); border:none; color:white; padding:7px 13px; border-radius:9px; font-size:12px; font-weight:700; }
  .header .hdr-btn:active { transform:scale(0.96); }
  .header .back-btn { background:rgba(255,255,255,0.18); border:none; color:white; width:34px; height:34px; border-radius:9px; font-size:18px; display:flex; align-items:center; justify-content:center; }

  .bottom-nav {
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:500px; background:white; display:flex;
    border-top:1px solid var(--border);
    box-shadow:0 -3px 14px rgba(0,0,0,0.05); z-index:100;
    padding-bottom:env(safe-area-inset-bottom, 0);
  }
  .nav-btn {
    flex:1; padding:9px 2px 8px; background:none; border:none;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--text-light); font-size:10px; font-weight:600;
    transition:color 0.2s; position:relative;
  }
  .nav-btn .nav-icon { font-size:21px; transition:transform 0.2s; }
  .nav-btn.active { color:var(--primary); }
  .nav-btn.active .nav-icon { transform:translateY(-1px) scale(1.08); }

  .hero {
    background:linear-gradient(135deg, #ff5722 0%, #ff9800 100%);
    color:white; padding:34px 22px 30px; text-align:center;
    border-radius:0 0 26px 26px; position:relative; overflow:hidden;
  }
  .hero::before { content:''; position:absolute; top:-50px; right:-50px; width:180px; height:180px; background:rgba(255,255,255,0.08); border-radius:50%; }
  .hero h2 { font-size:26px; font-weight:800; margin-bottom:10px; line-height:1.15; letter-spacing:-0.8px; }
  .hero p { font-size:14px; opacity:0.95; line-height:1.5; max-width:340px; margin:0 auto; }
  .hero .stats { display:flex; justify-content:space-around; margin-top:22px; gap:8px; }
  .hero .stat { flex:1; }
  .hero .stat .num { font-size:20px; font-weight:800; }
  .hero .stat .label { font-size:11px; opacity:0.9; margin-top:2px; }

  .section-head { padding:22px 18px 12px; font-size:18px; font-weight:800; letter-spacing:-0.4px; }
  .section-head.center { text-align:center; }

  .features-grid { display:grid; grid-template-columns:1fr 1fr; gap:11px; padding:0 16px; }
  .feature-card { background:var(--card); padding:15px; border-radius:var(--radius); box-shadow:var(--shadow); }
  .feature-card .ico { font-size:26px; margin-bottom:8px; }
  .feature-card h4 { font-size:13px; font-weight:800; margin-bottom:3px; }
  .feature-card p { font-size:11px; color:var(--text-light); line-height:1.4; }

  .about-box { background:white; margin:18px 16px; padding:20px; border-radius:var(--radius); box-shadow:var(--shadow); }
  .about-box h3 { color:var(--primary); font-size:17px; margin-bottom:12px; }
  .about-box p { font-size:13px; color:var(--text-light); line-height:1.7; margin-bottom:10px; }
  .about-box p:last-child { margin-bottom:0; }

  .role-chooser { padding:0 16px 26px; }
  .role-btn {
    width:100%; padding:20px 18px; background:white; border:2px solid var(--border);
    border-radius:18px; display:flex; align-items:center; gap:16px;
    margin-bottom:13px; text-align:left; transition:all 0.2s; box-shadow:var(--shadow);
  }
  .role-btn:active { transform:scale(0.98); }
  .role-btn:hover { border-color:var(--primary); }
  .role-btn .role-icon { font-size:34px; width:60px; height:60px; background:var(--primary-light); border-radius:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .role-btn .role-text h4 { font-size:16px; font-weight:800; margin-bottom:3px; }
  .role-btn .role-text p { font-size:12px; color:var(--text-light); }
  .role-btn .arrow { margin-left:auto; color:var(--text-light); font-size:20px; }

  .form-page { padding:22px 18px; }
  .form-page h2 { font-size:22px; font-weight:800; letter-spacing:-0.5px; margin-bottom:6px; }
  .form-page .sub { font-size:13px; color:var(--text-light); margin-bottom:22px; }
  .field { margin-bottom:15px; }
  .field label { display:block; font-size:12px; font-weight:700; margin-bottom:6px; color:var(--text); text-transform:uppercase; letter-spacing:0.3px; }
  .field input, .field textarea, .field select {
    width:100%; padding:13px 14px; border:1.5px solid var(--border); border-radius:11px;
    font-size:14px; background:white; color:var(--text); transition:border 0.15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { outline:none; border-color:var(--primary); }
  .field textarea { resize:vertical; min-height:82px; }
  .field small { font-size:11px; color:var(--text-light); display:block; margin-top:4px; }

  .btn {
    width:100%; padding:14px; background:var(--primary); color:white; border:none;
    border-radius:12px; font-size:15px; font-weight:700;
    transition:background 0.15s, transform 0.05s;
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
  }
  .btn:active { transform:scale(0.98); }
  .btn:hover { background:var(--primary-dark); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .btn.secondary { background:white; color:var(--primary); border:2px solid var(--primary); }
  .btn.ghost { background:transparent; color:var(--text-light); border:1.5px solid var(--border); }
  .btn.danger { background:var(--danger); }
  .btn.success { background:var(--success); }
  .btn.small { padding:8px 14px; font-size:13px; width:auto; }
  .btn.full { width:100%; }

  .switch-link { text-align:center; margin-top:18px; font-size:14px; color:var(--text-light); }
  .switch-link a { color:var(--primary); font-weight:700; cursor:pointer; text-decoration:none; }

  .content { padding:16px; }

  .card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden; }
  .card img { width:100%; max-height:240px; object-fit:cover; }
  .card .body { padding:14px; }
  .card h4 { font-size:15px; font-weight:700; margin-bottom:4px; }
  .card .price { color:var(--primary); font-weight:800; font-size:16px; }
  .card .desc { font-size:13px; color:var(--text-light); margin-top:6px; line-height:1.45; }
  .card .meta { font-size:12px; color:var(--text-light); margin-top:8px; display:flex; gap:12px; flex-wrap:wrap; }
  .card .actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }

  .empty { text-align:center; padding:52px 24px; color:var(--text-light); }
  .empty .ico { font-size:52px; opacity:0.35; margin-bottom:12px; }
  .empty p { font-size:14px; line-height:1.5; }

  .section-title { font-size:15px; font-weight:800; color:var(--text); margin:20px 4px 12px; display:flex; justify-content:space-between; align-items:center; }

  .badge { display:inline-block; padding:3px 9px; border-radius:6px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.4px; }
  .badge.pending { background:#fef3c7; color:#92400e; }
  .badge.preparing { background:#dbeafe; color:#1e40af; }
  .badge.delivering { background:#e0e7ff; color:#3730a3; }
  .badge.delivered { background:#d1fae5; color:#065f46; }
  .badge.cancelled { background:#fee2e2; color:#991b1b; }
  .badge.live { background:#ef4444; color:white; display:inline-flex; align-items:center; gap:5px; }

  .live-dot { width:6px; height:6px; border-radius:50%; background:white; animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

  .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-bottom:18px; }
  .stat-card { background:white; border-radius:var(--radius); padding:15px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
  .stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--primary); }
  .stat-card.info::before { background:var(--info); }
  .stat-card.success::before { background:var(--success); }
  .stat-card.warn::before { background:var(--warn); }
  .stat-card .num { font-size:22px; font-weight:800; letter-spacing:-0.6px; }
  .stat-card .label { font-size:11px; color:var(--text-light); margin-top:3px; font-weight:600; }

  .profile-head { text-align:center; padding:24px 16px 18px; background:white; margin-bottom:16px; border-radius:var(--radius); box-shadow:var(--shadow); }
  .avatar { width:88px; height:88px; border-radius:50%; background:var(--primary); color:white; display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:800; margin:0 auto 12px; overflow:hidden; border:4px solid white; box-shadow:var(--shadow-lg); }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  .profile-head h3 { font-size:18px; margin-bottom:4px; }
  .profile-head p { font-size:13px; color:var(--text-light); }

  .menu-list { background:white; border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:14px; }
  .menu-item { display:flex; align-items:center; gap:14px; padding:15px 16px; border-bottom:1px solid var(--border); }
  .menu-item:last-child { border-bottom:none; }
  .menu-item:active { background:var(--bg); }
  .menu-item .icon { font-size:21px; width:26px; text-align:center; }
  .menu-item .label { flex:1; font-size:14px; font-weight:600; }
  .menu-item .sub { font-size:11px; color:var(--text-light); margin-top:2px; font-weight:400; }
  .menu-item .arrow { color:var(--text-light); font-size:18px; }

  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; align-items:flex-end; justify-content:center; z-index:500; }
  .modal-bg.open { display:flex; }
  .modal { background:white; width:100%; max-width:500px; border-radius:22px 22px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom, 0)); max-height:90vh; overflow-y:auto; animation:slideUp 0.25s cubic-bezier(0.2, 0.9, 0.3, 1); }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .modal-head h3 { font-size:17px; font-weight:800; }
  .modal-close { background:var(--bg); border:none; color:var(--text-light); width:34px; height:34px; border-radius:50%; font-size:20px; display:flex; align-items:center; justify-content:center; line-height:1; }

  .toast { position:fixed; bottom:100px; left:50%; transform:translate(-50%, 100px); background:#1a1a1a; color:white; padding:12px 20px; border-radius:11px; font-size:14px; font-weight:600; z-index:9999; opacity:0; transition:all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1); pointer-events:none; max-width:90vw; text-align:center; box-shadow:var(--shadow-lg); }
  .toast.show { transform:translate(-50%, 0); opacity:1; }
  .toast.success { background:var(--success); }
  .toast.danger { background:var(--danger); }
  .toast.warn { background:var(--warn); color:#1a1a1a; }

  .video-box { width:100%; max-height:320px; background:#000; border-radius:10px; display:block; }
  .stream-box { background:#111; color:white; border-radius:var(--radius); overflow:hidden; aspect-ratio:16 / 9; display:flex; align-items:center; justify-content:center; position:relative; margin-bottom:14px; }
  .stream-box .live-tag { position:absolute; top:12px; left:12px; z-index:2; }
  .stream-box .placeholder { text-align:center; padding:20px; }
  .stream-box .placeholder .ico { font-size:42px; margin-bottom:8px; opacity:0.7; }

  .progress-labels { display:flex; justify-content:space-between; font-size:10px; color:var(--text-light); margin-bottom:6px; font-weight:600; }
  .progress-track { height:8px; background:var(--border); border-radius:4px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--primary); transition:width 0.4s; border-radius:4px; }

  .tabs { display:flex; gap:6px; padding:0 4px 12px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { padding:8px 14px; border-radius:20px; background:white; border:1.5px solid var(--border); font-size:13px; font-weight:700; white-space:nowrap; color:var(--text-light); flex-shrink:0; }
  .tab.active { background:var(--primary); color:white; border-color:var(--primary); }

  .banner { padding:12px 16px; border-radius:10px; font-size:13px; margin-bottom:14px; display:flex; gap:10px; align-items:flex-start; }
  .banner.warn { background:#fef3c7; color:#92400e; }
  .banner.danger { background:#fee2e2; color:#991b1b; }
  .banner.info { background:#dbeafe; color:#1e40af; }

  .pending-box { background:white; border-radius:var(--radius); padding:26px 20px; text-align:center; box-shadow:var(--shadow); }
  .pending-box .big-ico { font-size:64px; margin-bottom:12px; }
  .pending-box h3 { font-size:19px; margin-bottom:10px; }
  .pending-box p { font-size:14px; color:var(--text-light); line-height:1.6; margin-bottom:16px; }
  .pending-info { text-align:left; background:var(--bg); padding:14px; border-radius:10px; font-size:13px; line-height:1.9; }

  .distance-pill { display:inline-flex; align-items:center; gap:4px; background:var(--primary-light); color:var(--primary); padding:3px 9px; border-radius:8px; font-size:11px; font-weight:700; }

  .referral-code { font-size:26px; font-weight:800; letter-spacing:3px; background:var(--primary-light); color:var(--primary); padding:14px; border-radius:12px; margin:14px 0; text-align:center; }
  .referral-track { height:8px; background:var(--border); border-radius:4px; overflow:hidden; margin-top:8px; }
  .referral-fill { height:100%; background:var(--primary); transition:width 0.4s; border-radius:4px; }

  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .muted { color:var(--text-light); }
  .text-sm { font-size:12px; }
  .mt-1 { margin-top:8px; }
  .mt-2 { margin-top:16px; }
  .mb-2 { margin-bottom:16px; }
  .divider { height:1px; background:var(--border); margin:16px 0; }
  .hidden { display:none !important; }

  @media (max-width:380px) {
    .features-grid { grid-template-columns:1fr; }
    .hero h2 { font-size:22px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   FoodFast — Customer & Seller App (Backend Connected)
   ============================================================ */

const API_BASE = '/api';

/* ---------- API Client ---------- */
const API = {
  token: localStorage.getItem('ff_token') || null,
  setToken(t) {
    this.token = t;
    if (t) localStorage.setItem('ff_token', t);
    else localStorage.removeItem('ff_token');
  },
  async req(path, options = {}) {
    const headers = { ...(options.headers || {}) };
    if (!(options.body instanceof FormData)) headers['Content-Type'] = 'application/json';
    if (this.token) headers.Authorization = `Bearer ${this.token}`;
    const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error || 'Request failed');
    }
    return res.json();
  },
  get:  (p)    => API.req(p),
  post: (p, b) => API.req(p, { method:'POST', body: b instanceof FormData ? b : JSON.stringify(b) }),
  patch:(p, b) => API.req(p, { method:'PATCH', body: JSON.stringify(b) }),
  del:  (p)    => API.req(p, { method:'DELETE' })
};

/* ---------- Helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type='') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2400);
}

function distanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI / 180;
  const dLng = (lng2-lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* ---------- State ---------- */
const state = {
  view: 'loading',
  authRole: 'buyer',
  authMode: 'login',
  sellerTab: 'home',
  buyerTab: 'home',
  orderFilter: 'all',
  seller: null,   // logged-in user
  socket: null,
  cache: { posts:[], orders:[], reels:[], streams:[], users:[] },
  agoraClient: null,
  agoraTrack: null
};

function go(view, patch = {}) {
  state.view = view;
  Object.assign(state, patch);
  window.scrollTo(0, 0);
  render();
}

/* ---------- Sockets ---------- */
function connectSocket() {
  if (!state.seller) return;
  if (state.socket) return;
  state.socket = io(window.location.origin);
  state.socket.emit('join', { userId: state.seller._id || state.seller.id, role: state.seller.role });

  state.socket.on('order:new', () => { if (state.seller.role === 'seller') { toast('🔔 New order received!', 'success'); refreshCurrent(); } });
  state.socket.on('order:updated', () => { toast('📦 Order updated'); refreshCurrent(); });
  state.socket.on('user:warned', ({ reason }) => { toast('⚠️ Admin warning: ' + reason, 'warn'); });
  state.socket.on('user:blocked', () => { toast('🚫 Your account has been blocked', 'danger'); setTimeout(() => location.reload(), 2000); });
  state.socket.on('account:approved', () => { toast('🎉 Your account is approved!', 'success'); setTimeout(() => location.reload(), 1500); });
  state.socket.on('message:new', () => toast('💬 New message from admin', 'success'));
  state.socket.on('stream:started', () => refreshCurrent());
  state.socket.on('stream:ended', () => refreshCurrent());
}

async function refreshCurrent() {
  // Reload data for current tab
  const v = state.view;
  if (v === 'sellerApp' || v === 'buyerApp') await loadCache();
  render();
}

/* ---------- Data loading ---------- */
async function loadCache() {
  try {
    const [posts, reels, streams] = await Promise.all([
      API.get('/posts').catch(() => []),
      API.get('/reels').catch(() => []),
      API.get('/agora/live').catch(() => [])
    ]);
    state.cache.posts = posts;
    state.cache.reels = reels;
    state.cache.streams = streams;
    if (state.seller) {
      state.cache.orders = await API.get('/orders/my').catch(() => []);
    }
  } catch (err) {
    console.error('Load cache error:', err);
  }
}

/* ============================================================
   BOOT
   ============================================================ */
(async function boot() {
  if (API.token) {
    try {
      const me = await API.get('/auth/me');
      state.seller = me;
      state.view = me.role === 'seller' ? 'sellerApp' : 'buyerApp';
      await loadCache();
      connectSocket();
    } catch (e) {
      API.setToken(null);
      state.view = 'landing';
    }
  } else {
    state.view = 'landing';
  }
  render();
})();

/* ============================================================
   RENDER ROUTER
   ============================================================ */
function render() {
  const root = $('#root');
  switch (state.view) {
    case 'loading':    root.innerHTML = `<div class="app no-nav" style="display:flex;align-items:center;justify-content:center;padding-top:80px;font-size:48px;">🍔</div>`; break;
    case 'landing':    root.innerHTML = renderLanding(); break;
    case 'auth':       root.innerHTML = renderAuth(); break;
    case 'sellerApp':  root.innerHTML = renderSellerApp(); break;
    case 'buyerApp':   root.innerHTML = renderBuyerApp(); break;
    default:           root.innerHTML = renderLanding();
  }
}

/* ============================================================
   LANDING
   ============================================================ */
function renderLanding() {
  return `
  <div class="app no-nav">
    <div class="header">
      <div class="logo"><span class="logo-icon">🍔</span><h1>FoodFast</h1></div>
    </div>
    <div class="hero">
      <h2>Order & Sell Food — Fast</h2>

function detectLocation() {
  if (!navigator.geolocation) { toast('Geolocation not supported', 'warn'); return; }
  toast('Detecting location...');
  navigator.geolocation.getCurrentPosition(
    pos => {
      $('#latField').value = pos.coords.latitude.toFixed(6);
      $('#lngField').value = pos.coords.longitude.toFixed(6);
      $('#locStatus').textContent = `✓ Location set (${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)})`;
      toast('Location captured ✓', 'success');
    },
    err => toast('Could not get location: ' + err.message, 'danger'),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

async function handleAuth(e) {
  e.preventDefault();
  const btn = $('#authSubmitBtn');
  btn.disabled = true; btn.textContent = 'Please wait...';
  const fd = new FormData(e.target);
  const isSignup = state.authMode === 'signup';

  try {
    let result;
    if (isSignup) {
      result = await API.post('/auth/signup', {
        role: state.authRole,
        name: fd.get('name').trim(),
        email: fd.get('email').trim().toLowerCase(),
        phone: fd.get('phone').trim(),
        address: fd.get('address').trim(),
        password: fd.get('password'),
        lat: parseFloat(fd.get('lat')) || null,
        lng: parseFloat(fd.get('lng')) || null,
        businessName: state.authRole === 'seller' ? fd.get('businessName')?.trim() : undefined,
        businessType: state.authRole === 'seller' ? fd.get('businessType') : undefined,
        bio: state.authRole === 'seller' ? fd.get('bio')?.trim() : undefined,
        referral: (fd.get('referral') || '').trim().toUpperCase() || undefined
      });
    } else {
      result = await API.post('/auth/login', {
        email: fd.get('email').trim().toLowerCase(),
        password: fd.get('password'),
        role: state.authRole
      });
    }

    API.setToken(result.token);
    state.seller = result.user;
    await loadCache();
    connectSocket();

    toast(isSignup ? 'Account created ✓' : 'Welcome back!', 'success');
    go(state.seller.role === 'seller' ? 'sellerApp' : 'buyerApp');
  } catch (err) {
    toast(err.message, 'danger');
    btn.disabled = false;
    btn.textContent = isSignup ? 'Create Account' : 'Log In';
  }
}

async function startMyStream(e) {
  e.preventDefault();
  const btn = $('#goLiveBtn');
  btn.disabled = true; btn.textContent = 'Starting...';
  const fd = new FormData(e.target);
  const title = fd.get('title').trim();
  const channelName = 'live_' + (state.seller._id || state.seller.id) + '_' + Date.now();

  try {
    // 1. Create stream record on backend
    await API.post('/streams', { title, channelName });

    // 2. Get Agora token
    const { token, appId, uid } = await API.post('/agora/token', { channelName, role: 'publisher' });

    // 3. Join Agora channel and start camera
    await joinAgora(appId, channelName, token, uid, 'publisher', 'sellerLocalVideo');

    toast('You are LIVE 🔴', 'success');
    await loadCache();
    render();
  } catch (err) {
    toast('Failed to go live: ' + err.message, 'danger');
    btn.disabled = false; btn.textContent = '🔴 Go Live';
  }
}

async function joinAgora(appId, channelName, token, uid, role, containerId) {
  if (typeof AgoraRTC === 'undefined') {
    toast('Agora SDK not loaded', 'danger');
    return;
  }

  // Leave existing client if any
  if (state.agoraClient) {
    try { await state.agoraClient.leave(); } catch(e) {}
    state.agoraClient = null;
    state.agoraTrack = null;
  }

  const client = AgoraRTC.createClient({ mode: 'live', codec: 'vp8' });
  state.agoraClient = client;

  await client.join(appId, channelName, token, uid);

  if (role === 'publisher') {
    // We're the broadcaster — enable camera + mic
    const [videoTrack, audioTrack] = await AgoraRTC.createMicrophoneAndCameraTracks();
    state.agoraTrack = videoTrack;
    client.publish([videoTrack, audioTrack]);

    // Show our own video locally
    const container = document.getElementById(containerId);
    if (container) {
      container.innerHTML = '';
      videoTrack.play(container);
    }
  } else {
    // We're a viewer — subscribe to remote streams
    client.on('user-published', async (user, mediaType) => {
      await client.subscribe(user, mediaType);
      if (mediaType === 'video') {
        const container = document.getElementById(containerId);
        if (container) {
          container.innerHTML = '';
          user.videoTrack.play(container);
        }
      }
      if (mediaType === 'audio') user.audioTrack.play();
    });
  }
}

async function endMyStream(streamId) {
  try {
    if (state.agoraClient) {
      try { await state.agoraClient.leave(); } catch(e){}
      state.agoraClient = null;
      state.agoraTrack = null;
    }
    await API.post('/streams/' + streamId + '/end', {});
    toast('Stream ended', 'success');
    await loadCache();
    render();
  } catch (err) { toast(err.message, 'danger'); }
}

  const me = state.seller;

async function placeOrder(e, postId) {
  e.preventDefault();
  const btn = $('#orderSubmitBtn');
  btn.disabled = true; btn.textContent = 'Placing order...';
  const fd = new FormData(e.target);
  const post = state.cache.posts.find(p => String(p._id || p.id) === String(postId));
  const qty = parseInt(fd.get('qty')) || 1;

  try {
    await API.post('/orders', {
      items: [{ postId, title: post.title, price: post.price, qty }],
      address: fd.get('address').trim(),
      notes: (fd.get('notes') || '').trim()
    });
    toast('Order placed! 🎉', 'success');
    closeModal();
    await loadCache();
    state.buyerTab = 'myorders';
    render();
  } catch (err) {
    toast(err.message, 'danger');
    btn.disabled = false; btn.textContent = 'Confirm Order';
  }
}

async function watchStream(streamId) {
  const stream = state.cache.streams.find(s => String(s._id || s.id) === String(streamId));

  showModal(`📺 ${esc(stream.title)}`, `
    <div id="viewerVideo" style="width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;"></div>
    <p class="muted text-sm mt-2">by ${esc(stream.sellerId?.businessName || stream.sellerId?.name || 'Seller')}</p>
    <button class="btn ghost full mt-2" onclick="leaveStream()">Leave Stream</button>
  `);

  try {
    const channelName = stream.channelName || ('live_' + (stream.sellerId?._id || stream.sellerId) + '_' + (stream._id || stream.id));
    const { token, appId, uid } = await API.post('/agora/token', { channelName, role: 'audience' });

  } catch (err) {
    toast('Could not join stream: ' + err.message, 'danger');

    all: allOrders.length,
    pending: allOrders.filter(o => o.status === 'pending').length,
    preparing: allOrders.filter(o => o.status === 'preparing').length,
    delivering: allOrders.filter(o => o.status === 'delivering').length,
    delivered: allOrders.filter(o => o.status === 'delivered').length

  return `

      return `<div class="card"><div class="body">

function setMyLocation() {
  if (!navigator.geolocation) { toast('Not supported', 'warn'); return; }
  toast('Getting location...');
  navigator.geolocation.getCurrentPosition(
    async pos => {
      try {
        const updated = await API.patch('/users/me', {
          lat: pos.coords.latitude,
          lng: pos.coords.longitude
        });
        state.seller = updated;
        toast('Location set ✓', 'success');
        render();
      } catch (err) { toast(err.message, 'danger'); }
    },
    err => toast('Could not get location: ' + err.message, 'danger'),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function showModal(title, html) {
  let bg = document.getElementById('appModal');
  if (!bg) {
    bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.id = 'appModal';
    bg.onclick = (e) => { if (e.target === bg) closeModal(); };
    bg.innerHTML = `<div class="modal"><div class="modal-head"><h3 id="appModalTitle"></h3><button class="modal-close" onclick="closeModal()">×</button></div><div id="appModalBody"></div></div>`;
    document.body.appendChild(bg);
  }
  $('#appModalTitle').textContent = title;
  $('#appModalBody').innerHTML = html;
  bg.classList.add('open');
}

function closeModal() {
  const bg = document.getElementById('appModal');
  if (bg) bg.classList.remove('open');
}

function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(
      () => toast('Copied!', 'success'),
      () => toast('Copy failed', 'danger')
    );
  }
}
</script>
</body>
</html>
